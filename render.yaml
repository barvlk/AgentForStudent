services:
  - type: web
    name: agentforstudent
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm install --omit=dev
    startCommand: node --disable-warning=ExperimentalWarning server/index.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: AFS_DEMO_STUDENT_ID
        value: "441126225"
      - key: AFS_DEMO_PASSWORD
        value: "Demo2026x"
      - key: GEMINI_API_KEY
        sync: false
      # رابط قاعدة PostgreSQL (من Neon أو Supabase أو Render). بدونه تعمل القاعدة مؤقتة وتُمسح مع كل إعادة تشغيل.
      - key: DATABASE_URL
        sync: false
